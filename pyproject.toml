[project]
name = "web-audit-agent"
version = "0.1.0"
requires-python = ">=3.11.7"
dependencies = [
    "cryptography>=50.0.1",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "mcp>=2.2.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pixelmatch>=0.4.0",
    "playwright>=1.63.0",
    "pyotp>=2.10.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-playwright-asyncio>=0.9.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.test.py", "*_spec.py"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
